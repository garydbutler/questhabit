<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="200" height="200" rx="16" fill="#0F0F0F"/>
  
  <!-- Level Badge Circle -->
  <circle cx="100" cy="75" r="40" fill="#1A1A1A" stroke="#C0C0C0" stroke-width="4"/>
  
  <!-- Level Number -->
  <text x="100" y="90" text-anchor="middle" fill="#C0C0C0" font-family="system-ui" font-size="36" font-weight="bold">5</text>
  
  <!-- Tier Name -->
  <text x="100" y="135" text-anchor="middle" fill="#C0C0C0" font-family="system-ui" font-size="14" font-weight="600">Silver</text>
  
  <!-- XP Progress Bar Background -->
  <rect x="30" y="155" width="140" height="8" rx="4" fill="#252525"/>
  
  <!-- XP Progress Bar Fill (60%) -->
  <rect x="30" y="155" width="84" height="8" rx="4" fill="#FBBF24"/>
  
  <!-- XP Text -->
  <text x="100" y="180" text-anchor="middle" fill="#A1A1A1" font-family="system-ui" font-size="12">600 / 1000 XP</text>
</svg>
