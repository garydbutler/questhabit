<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="200" height="200" rx="16" fill="#0F0F0F"/>
  
  <!-- Title -->
  <text x="100" y="35" text-anchor="middle" fill="#A1A1A1" font-family="system-ui" font-size="14" font-weight="500">Today's Progress</text>
  
  <!-- Progress Circle Background -->
  <circle cx="100" cy="100" r="45" fill="none" stroke="#252525" stroke-width="8"/>
  
  <!-- Progress Circle (75%) -->
  <circle cx="100" cy="100" r="45" fill="none" stroke="#6366F1" stroke-width="8" 
          stroke-dasharray="283" stroke-dashoffset="71" stroke-linecap="round"
          transform="rotate(-90 100 100)"/>
  
  <!-- Percentage -->
  <text x="100" y="108" text-anchor="middle" fill="#FFFFFF" font-family="system-ui" font-size="28" font-weight="bold">75%</text>
  
  <!-- Count -->
  <text x="100" y="170" text-anchor="middle" fill="#FFFFFF" font-family="system-ui" font-size="16" font-weight="600">3/4 habits</text>
</svg>
