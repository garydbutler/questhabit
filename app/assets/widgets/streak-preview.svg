<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="200" height="200" rx="16" fill="#0F0F0F"/>
  
  <!-- Fire Icon Circle -->
  <circle cx="100" cy="70" r="35" fill="#1A1A1A" stroke="#22C55E" stroke-width="2"/>
  
  <!-- Fire Emoji (simplified) -->
  <text x="100" y="82" text-anchor="middle" font-size="32">🔥</text>
  
  <!-- Streak Count -->
  <text x="100" y="135" text-anchor="middle" fill="#22C55E" font-family="system-ui" font-size="36" font-weight="bold">14</text>
  <text x="100" y="155" text-anchor="middle" fill="#A1A1A1" font-family="system-ui" font-size="14" font-weight="500">days</text>
  
  <!-- Message -->
  <text x="100" y="180" text-anchor="middle" fill="#22C55E" font-family="system-ui" font-size="13" font-weight="600">On fire!</text>
</svg>
